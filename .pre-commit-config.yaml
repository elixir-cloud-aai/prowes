# Checks run on commit (`pre-commit install`) and in CI (`pre-commit run
# --all-files`, plus the manual-stage `gitleaks-all` hook); hook versions are
# pinned to commits. The semgrep and ast-grep hooks of proTES follow with
# their rules (#109), actionlint with the CI rewrite (#108)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        # The lock of all dependencies (`uv.lock`, generated by uv) is larger
        exclude: ^uv\.lock$
      - id: check-merge-conflict
      - id: check-yaml
        # Helm templates are not valid YAML before rendering
        exclude: ^deployment/templates/
      # Vendored GA4GH specifications are kept as published
      - id: end-of-file-fixer
        exclude: ^pro_wes/api/[0-9]
      - id: trailing-whitespace
        exclude: ^pro_wes/api/[0-9]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5  # frozen: v0.17.4
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      # Staged changes on commit
      - id: gitleaks
      # The whole checkout, in CI (`--hook-stage manual`); also scans
      # untracked and ignored files when run locally
      - id: gitleaks
        alias: gitleaks-all
        name: Detect hardcoded secrets (all files)
        entry: gitleaks dir --redact --verbose
        stages: [manual]
  - repo: local
    hooks:
      # Local hooks use the installed dev dependencies (the `dev` extra of
      # `pyproject.toml`); mypy needs them to check imported packages
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
      # The lock (`uv.lock`) must match `pyproject.toml`; run `uv lock`
      # after changing dependencies
      - id: uv-lock
        name: uv lock check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
