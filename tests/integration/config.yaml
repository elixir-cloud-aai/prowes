# Config overlay for the integration test (`compose.yaml` of this
# directory): runs go to Sapporo, the one WES instance of the backend list,
# at its service name in Docker Compose, over HTTP (`url_schemes`), with the
# WES API at its root (`api_path`). It is labeled as WES 1.1, as its service
# info reports a version of its own (`sapporo-wes-2.1.0`), so that runs that
# choose the workflow engine (which Sapporo requires) are eligible for it.
# The Celery worker polls it every second. The fake WES of the smoke test
# (`../smoke/fake_wes.py`, not a backend here) is the identity provider
# whose access tokens proWES requires, as in the smoke test
# (`../smoke/config.yaml`); proWES has no credentials for Sapporo, which
# requires none (#182)
security:
  auth:
    issuers:
      - https://fake-wes/oidc/
    audience:
      - prowes-smoke
custom:
  post_runs:
    polling_wait: 1
  wes:
    backends:
      - type: ga4gh-wes
        url: http://sapporo:1122
        api_path: /
        labels:
          wes.version: "1.1"
        url_schemes:
          - http
