# Config overlay for the Compose smoke test (`tests/smoke/compose.yaml`):
# runs go to the fake WES (`fake_wes.py`), the one WES instance of the
# backend list, at its service name in Docker Compose (HTTPS, with the
# certificate authority of the fake WES, `REQUESTS_CA_BUNDLE`); the Celery
# worker polls it every second (instead of every 3 seconds), so that the
# smoke test sees state changes quickly. The fake WES is also the identity
# provider whose access tokens proWES requires (`security.auth`), reached
# over HTTPS as the WES API
security:
  auth:
    issuers:
      - https://fake-wes/oidc/
    audience:
      - prowes-smoke
custom:
  post_runs:
    polling_wait: 1
  wes:
    backends:
      - type: ga4gh-wes
        url: https://fake-wes
