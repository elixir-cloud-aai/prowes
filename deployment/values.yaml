# Default values for prowes.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# The chart's templates are mostly those of FOCA's library chart foca-common
# (see `Chart.yaml`), which reads these values (see docs/deployment.md).

# Resource names are derived from the release name: `<release>-prowes` (or
# `<release>` if it contains `prowes`) for the app and `<that name>-mongodb`,
# `-worker`, `-broker`, `-flower` and `-data` for MongoDB, the Celery worker,
# the broker, Flower and the storage of the runs; `nameOverride` replaces the
# chart name, `fullnameOverride` the derived app name (camelCase, as in other
# Helm charts). Set them at installation only: changing them later changes
# the pod selectors, which cannot be upgraded
nameOverride: ""
fullnameOverride: ""

# Public host name of the app (of the Ingress, HTTPRoute or OpenShift Route),
# e.g., `wes.example.org`
hostName: ""

# App config overriding the base config in the image (`pro_wes/config.yaml`
# of the image's version); mappings are merged recursively, other values
# (including lists) are replaced. Stored in a ConfigMap, so must not contain
# secrets (see docs/deployment.md, Configuration). Set the service info of
# the deployment: the base config describes an example deployment, which
# accepts CWL v1.0 runs only
config: {}
#   # Service info (GA4GH `Service` schema with the WES fields); mappings are
#   # merged with the defaults, so set all fields of the deployment. Without
#   # `version`, the app reports the version of its package
#   service_info:
#     service:
#       id: "org.example.wes"
#       name: "My WES gateway"
#       description: "WES gateway of My organization"
#       organization:
#         name: "My organization"
#         url: "https://organization.example.org"
#       contactUrl: "mailto:wes@example.org"
#       documentationUrl: "https://organization.example.org/wes"
#       environment: "prod"
#       workflow_type_versions:
#         CWL:
#           workflow_type_version: ["v1.0", "v1.2"]
#       workflow_engine_versions:
#         cwltool:
#           workflow_engine_version: ["3.1"]

prowes:
  # Image repository; may include a tag or digest instead of setting `tag`
  # (e.g., `elixircloud/prowes:1.2.3`). The image of the app also runs the
  # Celery worker (`worker`)
  image: elixircloud/prowes
  # Image tag; defaults to the chart's `appVersion`, i.e., `dev` (the latest
  # commit on `dev`) for the chart in the repository (see docs/deployment.md,
  # Image)
  tag: ""
  # Pull policy of the image (`Always`, `IfNotPresent` or `Never`)
  imagePullPolicy: Always
  # Path of the app's startup, readiness and liveness probes; change it if
  # the config disables the Swagger UI
  probePath: /ga4gh/wes/v1/ui/
  # Probes of the app's container (Kubernetes probe specs); if set, one
  # replaces the default on `probePath` entirely
  startupProbe: {}
  readinessProbe: {}
  livenessProbe: {}
  # Number of the app's pods; with more than one, the storage of the runs
  # (`storage`) must be enabled with `ReadWriteMany` (see docs/deployment.md, Storage of
  # the runs)
  replicas: 1
  # PodDisruptionBudget of the app's pods, so that voluntary disruptions
  # (e.g., node drains) evict at most `maxUnavailable` pods at once (1 if
  # neither it nor `minAvailable` is set), or keep at least `minAvailable`
  # (a number or a percentage, e.g., `50%`; set at most one of them). Only
  # rendered with more than one replica: a single pod is evicted on node
  # drains anyway, as a budget keeping it would block the drain
  podDisruptionBudget:
    enabled: true
    minAvailable: null
    maxUnavailable: null
  # Environment variables of the app's and the worker's containers
  # (Kubernetes `EnvVar`s), e.g., values from a Secret
  # (`valueFrom.secretKeyRef`), which must not be in `config`. Rendering
  # fails for the variables that the chart sets (`FOCA_CONFIG_OVERLAY`,
  # `GUNICORN_CMD_ARGS`, `MONGO_USERNAME`, `MONGO_PASSWORD`,
  # `CELERY_BROKER_URL`, `CELERY_RESULT_BACKEND`), for `MONGO_DBNAME`,
  # `MONGO_URI`, `MONGO_HOST` and `MONGO_PORT`, as the chart provisions the
  # database `runStore` (set `config.db` for an external MongoDB), and for
  # `PORT` (the chart's port is 8080). Pods read values from Secrets when
  # they start: restart them after changing a Secret
  # (`kubectl rollout restart`)
  extraEnv: []
  # Storage of the runs (`custom.post_runs.storage_path`, `/data`, or the
  # path that `config` sets), where the
  # app writes the attachments of each run; mounted into the app's pods only,
  # as the worker does not use it. A PersistentVolumeClaim (`<app name>-data`)
  # of `size`, with `accessModes` and `storageClass` (the cluster's default
  # class if empty, `-` for no dynamic provisioning), or the existing claim
  # `existingClaim` (set `accessModes` to its access modes). Without
  # `ReadWriteMany`, the app's pods are replaced
  # (`Recreate`) instead of rolled, so that the claim is never needed by two
  # pods on different nodes, and `replicas` must be 1. If disabled, the runs
  # are kept in an `emptyDir` (limited to `size`) and lost when the pod is
  # replaced, and `replicas` must be 1, too. Helm deletes the claim when the release is uninstalled, unless
  # `resourcePolicy` is `keep` (see docs/deployment.md, Storage of the runs)
  storage:
    enabled: true
    size: 1Gi
    accessModes: ["ReadWriteOnce"]
    storageClass: ""
    existingClaim: ""
    resourcePolicy: ""
  # The app is exposed for `hostName` via one of: an Ingress (`ingress`), a
  # Gateway API HTTPRoute (`httpRoute`; disable the Ingress to enable it) or,
  # if neither is enabled and the cluster serves Routes, an OpenShift Route
  # (`route`). See docs/deployment.md, Exposing the app
  ingress:
    enabled: true
    # Ingress class (`spec.ingressClassName`); the cluster's default class if
    # empty
    className: ""
    # Annotations of the Ingress, e.g., for the ingress controller's size
    # limit of request bodies (workflow attachments), TLS redirect or rate
    # limits; the chart sets none for particular controllers. They take
    # precedence over those set by the chart for `https`; `null` removes one
    # of these
    annotations: {}
    https:
      # Request a certificate from cert-manager (via `issuer`, a
      # ClusterIssuer) and serve HTTPS
      enabled: false
      issuer: letsencrypt-prod
  # Gateway API HTTPRoute (`gateway.networking.k8s.io/v1`) for `hostName`,
  # attached to an existing Gateway, whose listener terminates TLS; requires
  # `ingress.enabled: false`
  httpRoute:
    enabled: false
    # Annotations of the HTTPRoute
    annotations: {}
    # Gateways (or listeners, via `sectionName` or `port`) to attach to;
    # required if enabled, e.g., the HTTPS listener of a shared Gateway:
    # `[{name: gateway, namespace: gateway-system, sectionName: https}]`.
    # The Gateway's listener must allow routes from the release's namespace
    parentRefs: []
    # Filters of the route's rule (`HTTPRouteFilter`s), e.g., an
    # `ExtensionRef` to a resource of the Gateway implementation that limits
    # body sizes or rates
    filters: []
    # A second HTTPRoute (`<app name>-https-redirect`) that redirects HTTP to
    # HTTPS (`301`), attached to the Gateway's HTTP listener(s) in
    # `parentRefs` (required if enabled), e.g.,
    # `[{name: gateway, namespace: gateway-system, sectionName: http}]`; they
    # must not attach to the listeners of `httpRoute.parentRefs` (set
    # `sectionName` in both, or `port` in both). It has no annotations
    httpsRedirect:
      enabled: false
      parentRefs: []
  # OpenShift Route for all paths (TLS at the router, which redirects HTTP
  # to HTTPS)
  route:
    # Create the Route if neither the Ingress nor the HTTPRoute is enabled
    # and the cluster serves Routes; false, e.g., for a Route or HTTPRoute
    # of your own
    enabled: true
    # Annotations of the Route, e.g., for rate limits of the router
    # (`haproxy.router.openshift.io/rate-limit-connections`)
    annotations: {}
  # NetworkPolicy allowing connections to the app only from `ingressFrom`
  # (and the kubelet's probes; see docs/deployment.md, Network policies);
  # clusters without NetworkPolicy support ignore it. Disabled by default:
  # before enabling it, make `ingressFrom` match the pods of the ingress
  # controller or Gateway
  networkPolicy:
    enabled: false
    # NetworkPolicy peers (`spec.ingress[].from`) allowed to connect to the
    # app: none by default, as they depend on the cluster. Set them when
    # enabling the policy, which fails to render without peers (which would
    # allow all sources); see
    # https://github.com/elixir-cloud-aai/foca/blob/chart-v0.4.0/docs/helm-chart.md#networkpolicy-peers
    # for the peers of common ingress controllers and Gateways
    ingressFrom: []
  # Security contexts of the pod and the container (also of the worker); the
  # image runs as user 1000, and with a read-only root file system, temporary
  # files go to an `emptyDir` at `/tmp`. `fsGroup` makes the storage of the
  # runs writable for the image's user. On OpenShift, `runAsUser`,
  # `runAsGroup` and `fsGroup` are omitted, as OpenShift assigns them
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 1000
    # Changes the ownership of the volume recursively only while its root
    # doesn't have the group yet, not on every mount
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 256Mi
  # Size limit of the `emptyDir` at `/tmp` (the pod is evicted if it is
  # exceeded): a quantity (e.g., `64Mi`) or a number of bytes; `null` for none.
  # Uploads of workflow attachments may be buffered here
  tmpSizeLimit: 64Mi
  # Seconds that the app keeps serving after its pod is deleted, before it
  # shuts down (`preStop` hook), so that the ingress controller and Service
  # stop sending requests to it first; 0: no delay (no hook)
  preStopSleepSeconds: 5
  # Gunicorn, the image's WSGI server (passed via `GUNICORN_CMD_ARGS`; see
  # docs/deployment.md, Server). Each worker loads the whole app, so raise
  # the memory in `resources` before raising `workers`
  gunicorn:
    # Worker processes, and threads per worker (requests served at once)
    workers: 1
    threads: 4
    # Seconds after which workers whose main loop does not respond are
    # restarted (requests run in threads, so slow requests don't count)
    timeout: 30
    # Seconds that workers get to finish requests on shutdown (after
    # `preStopSleepSeconds`); the pod's termination grace period is both
    # plus 10 seconds
    gracefulTimeout: 20
    # Seconds after which idle keep-alive connections are closed (0: no
    # keep-alive); keep it longer than the upstream keep-alive timeout of the
    # ingress controller (e.g., 60 seconds for ingress-nginx), which would
    # otherwise reuse connections as they are closed (failing requests with
    # `502`)
    keepalive: 100
    # Further Gunicorn options, e.g., `["--access-logfile", "-"]` for an
    # access log; rendering fails for `--bind`/`-b` (the chart's ports are
    # 8080), `--preload` (MongoDB clients must be created after forking) and
    # `--graceful-timeout` (set `gracefulTimeout`)
    extraArgs: []

mongodb:
  # Deploy MongoDB with the app; if false, set the host (and port) of an
  # external MongoDB in `config.db`, and its app user's credentials via
  # `auth.existingSecret` (see docs/deployment.md, External MongoDB)
  enabled: true
  # MongoDB 8.0 refuses to start on Linux kernels 6.19 to 7.0.13
  # (https://jira.mongodb.org/browse/SERVER-121912). Pinned to a patch
  # version (or pin a digest), so that restarts don't change it; update it
  # with the chart
  image: docker.io/library/mongo:7.0.45
  # Pull policy of the image (`Always`, `IfNotPresent` or `Never`)
  imagePullPolicy: IfNotPresent
  auth:
    # Require credentials (set `existingSecret`); enforced on every start,
    # but users are only created when MongoDB starts with an empty data
    # directory, so create them first for existing databases. Without
    # authentication, any pod that can reach the MongoDB service can read
    # and modify the data, so disable it explicitly only if that is
    # acceptable
    enabled: true
    # Name of an existing Secret with keys `root-username` and
    # `root-password` (MongoDB root user; not needed for an external MongoDB)
    # and `username` and `password` (app user, created with access to the
    # app's database, `runStore`)
    existingSecret: ""
  # NetworkPolicy allowing connections to MongoDB only from the app's and
  # the worker's pods of this release (and the kubelet's probes); clusters
  # without NetworkPolicy support ignore it
  networkPolicy:
    enabled: true
  # Volume with MongoDB's data: a PersistentVolumeClaim (`<app name>-mongodb`)
  # of `size`, with `accessModes` and `storageClass` (the cluster's default
  # class if empty, `-` for no dynamic provisioning), or the existing claim
  # `existingClaim`. If disabled, the data is kept in an `emptyDir` (limited
  # to `size`) and lost when MongoDB's pod is replaced, e.g., for tests.
  # With `resourcePolicy: keep`, Helm keeps the claim (and the database) when
  # the release is uninstalled, or when the claim is removed from it (by
  # disabling persistence or switching to an existing claim); reinstalling
  # the release with the same name and namespace uses it again. Delete the
  # claim by hand to remove the data. Empty: Helm deletes the claim
  persistence:
    enabled: true
    size: 1Gi
    accessModes: ["ReadWriteOnce"]
    storageClass: ""
    existingClaim: ""
    resourcePolicy: keep
  # Security contexts of the pod and the container; the image starts as root
  # and switches to user `mongodb` (999), so the user is set here, and
  # `fsGroup` makes the data volume writable for it. On OpenShift,
  # `runAsUser`, `runAsGroup` and `fsGroup` are omitted, as OpenShift assigns
  # them
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 512Mi
  # Size limit of the `emptyDir` at `/tmp` (the pod is evicted if it is
  # exceeded): a quantity (e.g., `64Mi`) or a number of bytes; `null` for none
  tmpSizeLimit: 64Mi

# Celery worker, which tracks the progress of workflow runs at the WES
# instances: a Deployment with the app's image, config overlay, MongoDB
# credentials, `prowes.extraEnv` and security contexts, connected to the
# broker via `broker.existingSecret`. Required for proWES to track runs
worker:
  enabled: true
  # Command of the worker's container; `--task-events` sends the events that
  # Flower shows
  command:
  - celery
  - --app
  - pro_wes.celery_worker
  - worker
  - --concurrency=2
  - --task-events
  - --loglevel=INFO
  replicas: 1
  # Probes of the worker's container (Kubernetes probe specs; none by
  # default, so its pods are ready once started, also while Celery retries
  # to connect to the broker), e.g., an `exec` probe that runs
  # `celery --app pro_wes.celery_worker inspect ping` for the pod's worker;
  # such a check starts Python and creates the app, so give it long periods
  # and timeouts
  readinessProbe: {}
  livenessProbe: {}
  # Seconds that the worker gets to finish running tasks after its pod is
  # deleted (Celery's warm shutdown), before it is killed
  terminationGracePeriodSeconds: 30
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 512Mi
  # Size limit of the `emptyDir` at `/tmp` (the pod is evicted if it is
  # exceeded): a quantity (e.g., `64Mi`) or a number of bytes; `null` for none
  tmpSizeLimit: 64Mi

# Message broker of Celery
broker:
  # Deploy RabbitMQ as the broker (one pod), which keeps queued tasks in a
  # PersistentVolumeClaim (see `persistence`), so that they survive restarts
  # of its pod (e.g., on upgrades or node failures); if false, set
  # `existingSecret` to the URL of an external broker
  enabled: true
  # Name of an existing Secret with the key `broker-url`, the broker URL
  # (passed to the app, the worker and Flower as `CELERY_BROKER_URL`),
  # optionally `result-backend` (`CELERY_RESULT_BACKEND`; by default
  # `jobs.backend` of the config) and, for the bundled RabbitMQ, `username`
  # and `password` of its user, which its URL must contain, e.g.,
  # `pyamqp://<username>:<password>@<app name>-broker:5672//` (see
  # docs/deployment.md, Celery worker and broker; URL-encode reserved
  # characters of the credentials). Required
  existingSecret: ""
  # Pinned to a patch version (or pin a digest), so that restarts don't
  # change it; update it with the chart
  image: docker.io/library/rabbitmq:4.3.7
  # Pull policy of the image (`Always`, `IfNotPresent` or `Never`)
  imagePullPolicy: IfNotPresent
  # NetworkPolicy allowing connections to the broker only from the app's,
  # the worker's (and Flower's) pods of this release (and the kubelet's
  # probes); clusters without NetworkPolicy support ignore it
  networkPolicy:
    enabled: true
  # Security contexts of the pod and the container; the image runs as user
  # `rabbitmq` (999), and `fsGroup` makes the data volume writable for it.
  # On OpenShift, `runAsUser`, `runAsGroup` and `fsGroup` are omitted, as
  # OpenShift assigns them
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 512Mi
  # Volume with the broker's data (queued tasks): a PersistentVolumeClaim
  # (`<app name>-broker`) of `size`, with `accessModes` and `storageClass`
  # (the cluster's default class if empty, `-` for no dynamic provisioning),
  # or the existing claim `existingClaim`. RabbitMQ creates its user from
  # `existingSecret` only when it starts with empty data: after changing the
  # Secret's password, also change the user's. If disabled, the data is kept
  # in an `emptyDir`, and queued tasks are lost when the broker's pod is
  # replaced. Helm deletes the claim when the release is uninstalled, unless
  # `resourcePolicy` is `keep`
  persistence:
    enabled: true
    size: 1Gi
    accessModes: ["ReadWriteOnce"]
    storageClass: ""
    existingClaim: ""
    resourcePolicy: ""
  # Size limits of the `emptyDir`s with the broker's home (and, without
  # `persistence`, its data) and at `/tmp` (the pod is evicted if they are
  # exceeded): quantities (e.g., `1Gi`) or numbers of bytes; `null` for none
  dataSizeLimit: 1Gi
  tmpSizeLimit: 64Mi

# Flower, the monitoring UI of the Celery worker (optional; it shows the
# arguments of tasks, including the tokens of runs, so it requires basic
# authentication). Not exposed outside the cluster: reach it with `kubectl
# port-forward` (see docs/deployment.md, Flower)
flower:
  enabled: false
  # Name of an existing Secret with the key `basic-auth`, the credentials of
  # Flower's basic authentication (`<user>:<password>`); required if enabled
  existingSecret: ""
  # Pinned to a version (or pin a digest), so that restarts don't change it;
  # the version of `docker-compose.yaml`
  image: docker.io/mher/flower:2.1.0
  # Pull policy of the image (`Always`, `IfNotPresent` or `Never`)
  imagePullPolicy: IfNotPresent
  # NetworkPolicy allowing connections to Flower only from `ingressFrom`
  # (none by default: `kubectl port-forward` is not affected); clusters
  # without NetworkPolicy support ignore it
  networkPolicy:
    enabled: true
    # NetworkPolicy peers (`spec.ingress[].from`) allowed to connect to
    # Flower, e.g., an ingress controller in front of it
    ingressFrom: []
  # Security contexts of the pod and the container; the image runs as user
  # `flower` (1000). On OpenShift, `runAsUser`, `runAsGroup` and `fsGroup`
  # are omitted, as OpenShift assigns them
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 256Mi
  # Size limit of the `emptyDir` at `/tmp` (the pod is evicted if it is
  # exceeded): a quantity (e.g., `64Mi`) or a number of bytes; `null` for none
  tmpSizeLimit: 64Mi
