# FOCA configuration
# Available as attributes of `foca.get_config()`; the section `custom` via
# `foca.get_custom_config(pro_wes.config_models.CustomConfig)`
# Automatically validated via FOCA
# Strings may reference environment variables (`${VAR}`, or `${VAR:-default}`
# with a default); write `$$` for a literal `$`
# Cf. https://foca.readthedocs.io/en/latest/configuration/

# Server configuration; `host` and `port` apply to Flask's development server
# only (`python -m pro_wes.app`): the image serves the app with Gunicorn, on
# the address of FOCA's settings, `foca.gunicorn_config` (port 8080, or the
# environment variable `PORT`). The development server listens on the loopback
# interface only
# Cf. https://foca.readthedocs.io/en/latest/configuration/server/
server:
  host: "127.0.0.1"
  port: 8080
  # Debug mode allows executing arbitrary code; only enable it for local
  # development, on a loopback host
  debug: False
  testing: False
  # Maximum size of request bodies (10 MiB), with all workflow attachments;
  # larger requests are rejected with `413 Content Too Large` before they
  # are parsed. A reverse proxy in front of the app must allow at least as
  # much (e.g., ingress-nginx allows 1 MiB by default)
  max_content_length: 10485760

# Security configuration: the WES API requires access tokens of the trusted
# issuers (`issuers`), sent as bearer tokens, for all operations but `GET
# /service-info` (public, as the specification and the Swagger UI). Without
# trusted issuers (the default), all tokens are rejected (`401`), so
# deployments set them, and `audience`: only tokens for the apps calling
# proWES (e.g., the client IDs of its front ends) are accepted, e.g.:
#   issuers:
#     - https://login.example.org/oidc/
#   audience:
#     - my-portal-client-id
# Each run belongs to the caller that created it, the subject of its token
# namespaced by its issuer (`<issuer>|<subject>`, or the issuer's
# `namespace`); callers list, read and cancel their own runs only. Cf.
# `docs/access-control.md`
# Cf. https://foca.readthedocs.io/en/latest/configuration/auth/
security:
  auth:
    add_key_to_claims: True
    algorithms:
      - RS256
    allow_expired: False
    # Only access tokens as per RFC 9068 (`typ` header `at+jwt`); other
    # tokens of the issuers, such as ID tokens, are rejected
    verify_token_type: True
    issuers: []

# Database configuration
# Cf. https://foca.readthedocs.io/en/latest/configuration/db/
# The host and port are overridden by the environment variables `MONGO_HOST`
# and `MONGO_PORT`, the name of the database by `MONGO_DBNAME`; credentials
# come from `MONGO_USERNAME` and `MONGO_PASSWORD`, or the whole connection
# string from `MONGO_URI`
db:
  host: mongodb
  port: 27017
  dbs:
    runStore:
      collections:
        runs:
          # Created at start if missing; existing indexes are kept (see
          # "Database indexes" in `docs/operations.md`)
          indexes:
            # Run identifiers are unique: a duplicate is rejected on insert,
            # and `POST /runs` tries another identifier
            - keys:
                run_log.run_id: 1
              options:
                "unique": True
            # `GET /runs` with authentication: the runs of a user, newest
            # first
            - keys:
                user_id: 1
                _id: -1

# API configuration
# Cf. https://foca.readthedocs.io/en/latest/configuration/api/
api:
  specs:
    - path:
        - api/20230914.tag_1_1_0.workflow_execution_service.openapi.yaml
        - api/additions.openapi.yaml
      add_operation_fields:
        x-openapi-router-controller: pro_wes.ga4gh.wes.controllers
      add_security_fields:
        x-bearerInfoFunc: foca.security.auth.validate_token
      # Access tokens required (cf. `security.auth`); disabling it serves the
      # WES API to anyone, and runs have no owner
      disable_auth: False
      connexion:
        strict_validation: True
        # Responses are checked against the specification, so that no
        # unchecked data (e.g., of the remote WES) reaches clients; invalid
        # ones become `500` errors
        validate_responses: True
        base_path: /ga4gh/wes/v1
        options:
          swagger_ui: True
          serve_spec: True

# Logging configuration
# Cf. https://foca.readthedocs.io/en/latest/configuration/log/
log:
  version: 1
  disable_existing_loggers: False
  formatters:
    standard:
      class: logging.Formatter
      style: "{"
      format: "[{asctime}: {levelname:<8}] {message} [{name}]"
  handlers:
    console:
      class: logging.StreamHandler
      level: 20
      formatter: standard
      stream: ext://sys.stderr
  root:
    level: 10
    handlers: [console]

# Background job configuration: the message broker (RabbitMQ) at the host and
# port of the environment variables `RABBIT_HOST` and `RABBIT_PORT`, if set;
# the environment variables `CELERY_BROKER_URL` and `CELERY_RESULT_BACKEND`
# take precedence over these settings (e.g., for brokers with credentials)
# Cf. https://foca.readthedocs.io/en/latest/configuration/jobs/
jobs:
  host: ${RABBIT_HOST:-rabbitmq}
  port: ${RABBIT_PORT:-5672}
  backend: "rpc://"
  include:
    - pro_wes.tasks.track_run_progress

# Service info (`GET /service-info`), served by FOCA: the fields of `service`
# (the GA4GH service info and the WES fields, e.g., `workflow_type_versions`),
# the system state counts (`system_state_counts`), computed for each request
# by `runtime_fields`, and the version of the package (`pro-wes`), unless
# `service` sets `version`; set `id`, `name`, `organization` and the URLs to
# describe the deployment. The WES fields (of WES 1.1.0: the versions of each
# engine in `workflow_engine_versions` as objects) are checked on startup
# Cf. https://foca.readthedocs.io/en/latest/configuration/service-info/
service_info:
  package: pro-wes
  runtime_fields: pro_wes.ga4gh.wes.service_info.runtime_fields
  locked_fields:
    - system_state_counts
  service:
    id: v1.wes.ga4gh.org.example
    name: "proWES example deployment"
    type:
      group: "org.ga4gh"
      artifact: "wes"
      version: "1.1.0"
    description: "WES gateway service"
    organization:
      name: "Example organization"
      url: "https://example.org"
    contactUrl: "mailto:support@example.org"
    documentationUrl: "https://example.org/docs"
    createdAt: "2020-01-01T00:00:00Z"
    updatedAt: "2022-12-31T00:00:00Z"
    environment: "test"
    auth_instructions_url: "https://example.org/auth_instructions"
    default_workflow_engine_parameters: []
    supported_filesystem_protocols:
      - https
    supported_wes_versions:
      - 1.1.0
    tags:
      key: "value"
    workflow_engine_versions:
      cwl-engine:
        workflow_engine_version:
          - "1.2.3"
    workflow_type_versions:
      CWL:
        workflow_type_version:
          - v1.0

# Exception handling: problem details of exceptions (`title`, `status`,
# `detail`), sent with the media type of error responses of the GA4GH
# specifications (instead of FOCA's default `application/problem+json`)
# Cf. https://foca.readthedocs.io/en/latest/configuration/exceptions/
exceptions:
  mapping: pro_wes.exceptions.exceptions
  media_type: application/json

# Custom configuration (cf. `pro_wes.config_models.CustomConfig`)
custom:
  # Timeouts of requests to WES instances, in seconds, for each request as
  # a whole (positive numbers; they can't be switched off): status and
  # cancellation (`defaults.timeout`), forwarding runs and reading run logs
  # (`post_runs.timeout_post`)
  defaults:
    timeout: 2
  post_runs:
    db_insert_attempts: 10
    # Characters of run identifiers (taken as is, not evaluated)
    id_charset: ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
    id_length: 6
    polling_attempts: 100
    polling_wait: 3
    storage_path: "/data"
    timeout_job: null
    timeout_post: 30
    # Workflow attachments: at most 100 per run, of at most 1 MiB each
    # (`413 Content Too Large` otherwise)
    max_attachments: 100
    max_attachment_size: 1048576
    # Tags: at most 16 KiB of JSON text, as stored (`400 Bad Request`
    # otherwise); `GET /runs` lists stored runs with larger tags with `{}`
    max_tags_size: 16384
    # Runs with credentials in URLs (`https://user:password@host/...`):
    # `reject` (`400 Bad Request`) or `strip` (remove the credentials)
    url_credentials: reject
  # `GET /runs`: runs per page if the request sets no `page_size`, and at
  # most (`page_size` from 1 to `max_page_size`, `400 Bad Request`
  # otherwise; the default from 1 to `max_page_size`)
  list_runs:
    default_page_size: 5
    max_page_size: 100
  # WES instances that runs are forwarded to, in order: WES instances
  # (`type: ga4gh-wes`, with `url`, optionally `api_path`, `id`, `labels`,
  # `location`, `url_schemes`) and service registries whose verified WES
  # instances are used (`type: ga4gh-service-registry`); new runs go to the
  # first. None by default: `POST /runs` is refused (`503 Service
  # Unavailable`) until a deployment configures them, e.g.:
  #   backends:
  #     - type: ga4gh-wes
  #       url: https://wes.example.org
  # Cf. "WES instances" in `docs/configuration.md`
  # Responses of WES instances are read up to `max_response_size` bytes
  # (16 MiB); larger ones fail the request
  wes:
    backends: []
    max_response_size: 16777216
