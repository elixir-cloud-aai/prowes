---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.prowes.appName }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.prowes.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.prowes.appName }}
    spec:
      {{- if ne .Values.clusterType "openshift" }}
      # The image runs as the non-root user 1000; `fsGroup` makes the data
      # volume writable for it where Kubernetes manages the volume's
      # ownership, and `vol-init` (as root) hands `/data` over where it
      # doesn't (e.g., NFS); OpenShift assigns user and group itself
      securityContext:
        fsGroup: 1000
      {{- end }}
      {{- if eq .Values.storageAccessMode "ReadWriteOnce" }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - {{ .Values.celeryWorker.appName }}
            topologyKey: "kubernetes.io/hostname"
      {{- end }}
      initContainers:
      - name: vol-init
        image: busybox
        {{- if eq .Values.clusterType "openshift" }}
        command: [ 'mkdir' ]
        args: [ '-p', '/data/db', '/data/specs' ]
        {{- else }}
        command: [ 'sh', '-c' ]
        args: [ 'mkdir -p /data/db /data/specs && { chown 1000:0 /data && chmod 2775 /data || echo "warning: could not hand /data to user 1000" >&2; }' ]
        {{- end }}
        resources: {{- toYaml .Values.prowes.initResources | nindent 10 }}
        volumeMounts:
        - mountPath: /data
          name: prowes-volume
      containers:
      - name: prowes
        image: {{ .Values.prowes.image }}
        imagePullPolicy: Always
        workingDir: '/app'
        command: [ 'gunicorn' ]
        args: [ '--log-level', 'debug', '--config', 'python:pro_wes.gunicorn', 'pro_wes.wsgi:app' ]
        env:
        - name: MONGO_HOST
          value: {{ .Values.mongodb.appName }}
        - name: MONGO_PORT
          value: "27017"
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              key: databaseUser
              name: {{ .Values.mongodb.appName }}
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              key: databasePassword
              name: {{ .Values.mongodb.appName }}
        - name: MONGO_DBNAME
          valueFrom:
            secretKeyRef:
              key: databaseName
              name: {{ .Values.mongodb.appName }}
        - name: RABBIT_HOST
          value: {{ .Values.rabbitmq.appName }}
        - name: RABBIT_PORT
          value: "5672"
        resources: {{- toYaml .Values.prowes.resources | nindent 10 }}
        livenessProbe:
          tcpSocket:
            port: prowes-port
          initialDelaySeconds: 5
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /ga4gh/wes/v1/service-info
            port: prowes-port
          initialDelaySeconds: 3
          periodSeconds: 3
        ports:
        - containerPort: 8080
          name: prowes-port
        volumeMounts:
        - mountPath: /data
          name: prowes-volume
      volumes:
      - name: prowes-volume
        persistentVolumeClaim:
          claimName: {{ .Values.prowes.appName }}-volume
