name: proWES checks

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]


jobs:
  lint:
    name: Run static code analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      # The Python version of the base image in the `Dockerfile`
      # (`requires-python` in `pyproject.toml`)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      # uv, at the version locked in `uv.lock` (a dev dependency)
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      # The versions of `uv.lock`; `--locked` fails if the lock doesn't
      # match `pyproject.toml` (run `uv lock` after changing dependencies)
      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --python "$(which python)"
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      # ruff, mypy, the lock check and file checks (`.pre-commit-config.yaml`)
      - name: Run linters and type checks
        run: |
          pre-commit run --all-files --show-diff-on-failure
          pre-commit run --all-files --hook-stage manual gitleaks-all
      - name: Run unit tests
        run: pytest
  test:
    name: Run tests
    runs-on: ubuntu-latest
    env:
      PROBE_ENDPOINT: localhost:8090/ga4gh/wes/v1/service-info
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      # Dummy secret files, which must not reach the image (see below)
      - name: Plant dummy secret files
        run: |
          echo "DUMMY=not-a-secret" > pro_wes/.env
          echo "dummy" > pro_wes/tls.key
      - name: Deploy app
        run: docker compose up -d --build
      - name: Wait for app startup
        run: sleep 20
      - name: Probe endpoint
        run: |
          test $( \
            curl \
             -sL \
             -v \
             -o /dev/null \
             -w '%{http_code}' \
             -X GET \
             --header 'Accept: application/json' \
             "${PROBE_ENDPOINT}" \
            ) == '200' || exit 1
      # `prowes:latest` is the image that `docker-compose.yaml` builds
      - name: Check that secret files are not in the image
        run: |
          docker run --rm --entrypoint sh prowes:latest -c \
            'test ! -e /app/pro_wes/.env && test ! -e /app/pro_wes/tls.key'
  publish:
    name: Build and publish app image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    needs: [lint, test]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Generate tag
        run: |
          echo "TAG=$(date '+%Y%m%d')" >> $GITHUB_ENV
      - name: Build and publish image
        id: docker
        uses: philips-software/docker-ci-scripts@v5.0.0
        with:
          dockerfile: .
          image-name: "prowes"
          tags: "latest ${{ env.TAG }}"
          push-branches: "${{ github.event.repository.default_branch }}"
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_LOGIN }}
          REGISTRY_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}"
          DOCKER_ORGANIZATION: ${{ secrets.DOCKERHUB_ORG }}
          GITHUB_ORGANIZATION: ${{ github.repository_owner }}
      - name: Verify that image was pushed
        run: |
          echo "Push indicator: ${{ steps.docker.outputs.push-indicator }}"
          echo "# Set to 'true' if image was pushed, empty string otherwise"
          test "${{ steps.docker.outputs.push-indicator }}" == "true"
