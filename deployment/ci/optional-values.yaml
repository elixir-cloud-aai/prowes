# Values for rendering the chart in CI with its optional parts: Flower, an
# environment variable from a Secret (`prowes.extraEnv`), the service info of
# the deployment (`config`) and several replicas on shared storage
# (`prowes.replicas`, `prowes.storage`); used together with `test-values.yaml`
# (see `.github/workflows/ci.yml`)
prowes:
  replicas: 2
  storage:
    accessModes: ["ReadWriteMany"]
  extraEnv:
  - name: WES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: wes-credentials
        key: password
flower:
  enabled: true
  existingSecret: flower
config:
  service_info:
    service:
      id: org.example.wes
      name: Example WES gateway
      workflow_type_versions:
        CWL:
          workflow_type_version: ["v1.0", "v1.2"]
