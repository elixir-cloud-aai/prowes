# Compose override for the smoke test (`check.sh` of this directory, job
# `smoke` of `.github/workflows/ci.yml`): proWES and the Celery worker send
# runs to a fake WES (`fake_wes.py`) instead of a real one, with the config
# overlay `config.yaml` of this directory. Use it with `docker compose -f
# docker-compose.yaml -f tests/smoke/compose.yaml up -d --build --wait`
# (`check.sh` does); relative paths are resolved against the directory of
# the first file, i.e., the repository root. The image is tagged
# `prowes:smoke`, so that the test leaves the image of other local
# deployments (`prowes:local`) alone
#
# proWES sends runs to the WES instance of the config overlay
# (`custom.wes.backends`): the fake WES, at its service name `fake-wes` (also
# `HOSTS` in `fake_wes.py`), with a certificate of its own certificate
# authority, which proWES trusts instead of the public ones
# (`REQUESTS_CA_BUNDLE`), so that no run leaves the Compose network

# Settings of the app and the Celery worker
x-smoke: &smoke
  image: prowes:smoke
  environment:
    FOCA_CONFIG_OVERLAY: /smoke/config.yaml
    REQUESTS_CA_BUNDLE: /certs/ca.pem
  volumes:
    - ./tests/smoke:/smoke:ro
    - smoke-certs-data:/certs:ro
  depends_on:
    fake-wes:
      condition: service_healthy

services:

  prowes:
    <<: *smoke

  prowes-worker:
    <<: *smoke

  # Creates the certificates of the fake WES in a volume of their own, as
  # root, as a new volume belongs to root (the fake WES reads them as the
  # user of the image); keeps existing ones
  smoke-certs:
    image: prowes:smoke
    pull_policy: never
    user: "0"
    command: ["python", "/smoke/fake_wes.py", "certs", "/certs"]
    volumes:
      - ./tests/smoke:/smoke:ro
      - smoke-certs-data:/certs
    # The image's health check probes the app, which doesn't run here
    healthcheck:
      disable: true
    restart: "no"

  # The fake WES, in the app's image (built for the other services), with
  # the image's health check probing its service info over plain HTTP (more
  # often)
  fake-wes:
    image: prowes:smoke
    pull_policy: never
    command: ["python", "/smoke/fake_wes.py", "serve", "/certs"]
    environment:
      HEALTHCHECK_URL: http://localhost:8080/ga4gh/wes/v1/service-info
    volumes:
      - ./tests/smoke:/smoke:ro
      - smoke-certs-data:/certs:ro
    depends_on:
      smoke-certs:
        condition: service_completed_successfully
    healthcheck:
      interval: 5s
      start_period: 5s

volumes:
  smoke-certs-data:
