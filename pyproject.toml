[build-system]
# The dependency group `build-system` lists the same requirements, locked in
# `uv.lock` with their hashes, which the image build installs
# (`Dockerfile`; `tests/test_image_build.py` checks that they match)
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# The rule set shared by FOCA and FOCA apps (as in proTES and
# cloud-registry): FOCA's rules plus `G` and `S`; `D` applies everywhere,
# also to the tests
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle (docstrings)
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "G",    # flake8-logging-format
    "I",    # isort
    "PL",   # Pylint
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    # Complexity limits, as in FOCA: some functions mirror the API's
    # operations or take many test fixtures, and splitting them would obscure
    # them
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    "PLR0917",  # too-many-positional-arguments
    # Flags HTTP status codes and other literals (e.g., lengths), which are
    # clear as is
    "PLR2004",  # magic-value-comparison
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["pro_wes", "tests"]

[tool.ruff.lint.per-file-ignores]
# pytest checks with `assert`
"tests/**" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
files = ["pro_wes", "tests"]
python_version = "3.13"
# Complete type hints: all functions annotated, generic types parametrized
# (instead of ruff's `ANN` rules, which report missing hints only, without
# checking them)
disallow_untyped_defs = true
disallow_any_generics = true
warn_unused_ignores = true

# Connexion 2 ships no type information
[[tool.mypy.overrides]]
module = ["connexion", "connexion.*"]
ignore_missing_imports = true

# mongomock ships no type information (used by the tests only)
[[tool.mypy.overrides]]
module = ["mongomock", "mongomock.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pro_wes"]

# 100% coverage is the goal (#81); reported in CI without a threshold until
# then
[tool.coverage.report]
show_missing = true

[project]
name = "pro-wes"
authors = [
    {name = "ELIXIR On-Cloud", email = "cloud-service@elixir-europe.org"},
    {name = "Alexander Kanitz"},
]
keywords = [
    "ga4gh", "wes", "proxy", "gateway", "elixir", "cloud", "rest", "restful",
    "api", "app", "server", "openapi", "swagger", "mongodb", "python", "flask"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
# The Python version of the base image in the `Dockerfile`, the only one the
# app is tested with (as in proTES)
requires-python = ">=3.13"
description = "Proxy for GA4GH Workflow Execution Service (WES) instances by ELIXIR On-Cloud"
license = "Apache-2.0"
dynamic = ["version"]
dependencies = [
    "connexion>=2.15.1,<3",
    "email-validator>=2.1.0,<3",
    # FOCA minors are bumped by hand, together with the base image in the
    # `Dockerfile` (`.github/dependabot.yml`)
    "foca>=0.22.0,<0.23",
    "gunicorn>=26.2.0,<28",
    "requests>=2.33.0,<3",
]

[project.optional-dependencies]
# Local hooks of `.pre-commit-config.yaml` use these too
dev = [
    "ast-grep-cli>=0.51",
    "celery-types>=0.20.0",
    "coverage>=7.16",
    "mongomock>=4.3",
    "mypy>=2.4",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.33",
    # Locks the dependencies (`uv lock`, checked by pre-commit); also the
    # version of uv that CI (`astral-sh/setup-uv`) and Read the Docs
    # (`.readthedocs.yaml`, checked by the tests) install
    "uv>=0.13",
]
# Documentation (`mkdocs.yml`), built by Read the Docs (`.readthedocs.yaml`)
# and in CI, both with the versions of the lock (`uv.lock`). The packages
# that add warnings, which fail the strict build, are listed too, to bound
# their major versions (new warnings of minor releases still fail it)
docs = [
    "griffelib>=2.4,<3",
    "mkdocs>=1.6.1,<2",
    "mkdocs-autorefs>=1.4.4,<2",
    "mkdocs-material>=9.7.7,<10",
    # 1.0.6 and earlier fail with pymdown-extensions 12
    "mkdocstrings>=1.0.8,<2",
    "mkdocstrings-python>=2.0.10,<3",
    "pymdown-extensions>=12.3,<14",
]

[dependency-groups]
# The build requirements of the app (the same as `build-system.requires`,
# checked by the tests), locked in `uv.lock` with their hashes, so that the
# image build installs them hash-checked; Dependabot updates them with the
# other locked packages
build-system = ["setuptools>=77", "setuptools-scm>=8"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
homepage = "https://github.com/elixir-cloud-aai/prowes"
Tracker = "https://github.com/elixir-cloud-aai/prowes/issues"
Documentation = "https://prowes.readthedocs.io"

[tool.setuptools_scm]
# Version from Git tags (`vX.Y.Z`), the only place it is stored; builds
# without Git metadata (e.g., Docker builds, which get no `.git`) report the
# fallback unless `SETUPTOOLS_SCM_PRETEND_VERSION` is set
fallback_version = "0.0.0.dev0"

[tool.setuptools.packages.find]
include = ["pro_wes*"]

[tool.setuptools.package-data]
pro_wes = ["config.yaml", "api/*.yaml"]
