# Merged over the vendored WES 1.1.0 specification
# (`20230914.tag_1_1_0.workflow_execution_service.openapi.yaml`): mappings
# are merged, other values replaced. Every deviation from WES 1.1.0 that
# this file makes is listed in `docs/api.md` and in `ALLOWED_DEVIATIONS` of
# `tests/ga4gh/wes/test_spec.py`, which fails on any other deviation; add new
# ones to both.
openapi: 3.0.2
info:
  title: "proWES"
  description: |
    Gateway GA4GH Workflow Execution Service (WES) API implementation; forwards
    incoming run requests to known WES instances and harmonizes the experience
    More information on [GitHub](https://github.com/elixir-cloud-aai/proWES).
  # Version of the WES specification served (it replaces that of the
  # specification, as this file is merged over it)
  version: 1.1.0
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0"
  contact:
    name: "ELIXIR Cloud & AAI"
    email: "alexander.kanitz@alumni.ethz.ch"
servers:
  - url: /ga4gh/wes/v1
# All operations require an access token (bearer token, validated by FOCA:
# `x-bearerInfoFunc` of `api.specs` in `config.yaml`), but the service info
security:
  - bearerAuth: []
paths:
  /service-info:
    get:
      # Served by FOCA from the config (`service_info`); the controller set
      # here takes precedence over the one added to all operations
      # (`api.specs` in `config.yaml`)
      x-openapi-router-controller: foca.api.service_info
      # Public
      security: []
      responses:
        # Replaces the schema of the declared error response (`ErrorResponse`)
        400: &problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        401: *problem
        403: *problem
        500: *problem
  /runs:
    get:
      responses:
        400: *problem
        401: *problem
        403: *problem
        500: *problem
    post:
      responses:
        400: *problem
        401: *problem
        403: *problem
        # proWES extension
        413:
          description: >-
            proWES extension: the request body is larger than
            `server.max_content_length`, the run has more workflow
            attachments than `custom.post_runs.max_attachments`, or an
            attachment is larger than `custom.post_runs.max_attachment_size`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        500: *problem
        # proWES extension
        503:
          description: >-
            proWES extension: no WES instance is available for new runs
            (`custom.wes.backends`); the run is not stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /runs/{run_id}:
    get:
      responses:
        # proWES extension: requests with unknown or invalid parameters are
        # rejected (`strict_validation`)
        400: &invalid_parameters
          description: >-
            proWES extension: the request has unknown or invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        401: *problem
        403: *problem
        404: *problem
        500: *problem
  /runs/{run_id}/status:
    get:
      responses:
        400: *invalid_parameters
        401: *problem
        403: *problem
        404: *problem
        500: *problem
  /runs/{run_id}/tasks:
    get:
      responses:
        400: *invalid_parameters
        401: *problem
        403: *problem
        404: *problem
        500: *problem
        # proWES extension, until the tasks are served (#124)
        501: &tasks_not_served
          description: >-
            proWES extension: the tasks of runs are not served yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /runs/{run_id}/tasks/{task_id}:
    get:
      responses:
        400: *invalid_parameters
        401: *problem
        403: *problem
        404: *problem
        500: *problem
        501: *tasks_not_served
  /runs/{run_id}/cancel:
    post:
      responses:
        400: *invalid_parameters
        401: *problem
        403: *problem
        404: *problem
        # proWES extension: runs that aren't cancelable (cf. `cancel_run`)
        # aren't canceled at the WES instance
        409:
          description: >-
            proWES extension: the run isn't cancelable in its current state
            (it has finished, is being canceled, or is of unknown state and
            not forwarded yet).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        500: *problem
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # Problem details (RFC 9457), as proWES sends them (FOCA; cf.
    # `pro_wes/exceptions.py` and `exceptions` in `config.yaml`); they
    # replace `ErrorResponse` in all error responses
    ProblemDetails:
      description: >-
        Problem details of an error (RFC 9457); further members may be
        added.
      type: object
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: >-
            URI of the problem type; only for requests with invalid fields.
        title:
          type: string
          description: Short summary of the problem type.
        status:
          type: integer
          format: int32
          description: HTTP status code of the response.
        detail:
          type: string
          description: Explanation of this occurrence of the problem.
        code:
          type: string
          description: >-
            Code of the problem (`invalid-request`); only for requests with
            invalid fields.
        errors:
          type: array
          description: >-
            The invalid fields of a rejected request (at most 100); only for
            requests with invalid fields.
          maxItems: 100
          items:
            type: object
            required:
              - detail
              - code
            properties:
              detail:
                type: string
                description: What is wrong with the field.
              pointer:
                type: string
                description: >-
                  JSON Pointer (as URI fragment) to the invalid field of the
                  request body; for fields of the body.
              parameter:
                type: string
                description: Name of the invalid parameter; for parameters.
              code:
                type: string
                description: Code of the kind of error.
    # `Service` and `ServiceType` schemas of the GA4GH service info
    # specification (version 1.0.0), referenced by the WES specification
    Service:
      description: "GA4GH service"
      type: object
      required:
        - id
        - name
        - type
        - organization
        - version
      properties:
        id:
          type: string
          description: "Unique ID of this service. Reverse domain name notation is recommended, though not required. The identifier should attempt to be globally unique so it can be used in downstream aggregator services e.g. Service Registry."
          example: "org.ga4gh.myservice"
        name:
          type: string
          description: "Name of this service. Should be human readable."
          example: "My project"
        type:
          $ref: "#/components/schemas/ServiceType"
        description:
          type: string
          description: "Description of the service. Should be human readable and provide information about the service."
          example: "This service provides..."
        organization:
          type: object
          description: "Organization providing the service"
          required:
            - name
            - url
          properties:
            name:
              type: string
              description: "Name of the organization responsible for the service"
              example: "My organization"
            url:
              type: string
              format: uri
              description: "URL of the website of the organization (RFC 3986 format)"
              example: "https://example.com"
        contactUrl:
          type: string
          format: uri
          description: "URL of the contact for the provider of this service, e.g. a link to a contact form (RFC 3986 format), or an email (RFC 2368 format)."
          example: "mailto:support@example.com"
        documentationUrl:
          type: string
          format: uri
          description: "URL of the documentation of this service (RFC 3986 format). This should help someone learn how to use your service, including any specifics required to access data, e.g. authentication."
          example: "https://docs.myservice.example.com"
        createdAt:
          type: string
          format: date-time
          description: "Timestamp describing when the service was first deployed and available (RFC 3339 format)"
          example: "2019-06-04T12:58:19Z"
        updatedAt:
          type: string
          format: date-time
          description: "Timestamp describing when the service was last updated (RFC 3339 format)"
          example: "2019-06-04T12:58:19Z"
        environment:
          type: string
          description: "Environment the service is running in. Use this to distinguish between production, development and testing/staging deployments. Suggested values are prod, test, dev, staging. However this is advised and not enforced."
          example: "test"
        version:
          type: string
          description: "Version of the service being described. Semantic versioning is recommended, but other identifiers, such as dates or commit hashes, are also allowed. The version should be changed whenever the service is updated."
          example: "1.0.0"
    ServiceType:
      description: "Type of a GA4GH service"
      type: object
      required:
        - group
        - artifact
        - version
      properties:
        group:
          type: string
          description: "Namespace in reverse domain name format. Use `org.ga4gh` for implementations compliant with official GA4GH specifications. For services with custom APIs not standardized by GA4GH, or implementations diverging from official GA4GH specifications, use a different namespace (e.g. your organization's reverse domain name)."
          example: "org.ga4gh"
        artifact:
          type: string
          description: "Name of the API or GA4GH specification implemented. Official GA4GH types should be assigned as part of standards approval process. Custom artifacts are supported."
          example: "beacon"
        version:
          type: string
          description: "Version of the API or specification. GA4GH specifications use semantic versioning."
          example: "1.0.0"
