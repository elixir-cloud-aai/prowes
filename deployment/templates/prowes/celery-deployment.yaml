apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.celeryWorker.appName }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.celeryWorker.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.celeryWorker.appName }}
    spec:
      {{- if ne .Values.clusterType "openshift" }}
      # The image runs as the non-root user 1000; `fsGroup` makes the data
      # volume writable for it where Kubernetes manages the volume's
      # ownership, and `vol-init` (as root) hands `/data` over where it
      # doesn't (e.g., NFS); OpenShift assigns user and group itself.
      # `OnRootMismatch`: the volume is changed recursively only while
      # `/data` doesn't have the group yet, not on every mount
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      {{- end }}
      initContainers:
      - name: vol-init
        image: busybox
        {{- if eq .Values.clusterType "openshift" }}
        command: [ 'mkdir' ]
        args: [ '-p', '/data/db', '/data/output', '/data/tmp' ]
        {{- else }}
        command: [ 'sh', '-c' ]
        # Best effort (e.g., NFS with `root_squash` refuses both): the app
        # refuses to start if it can't write to `/data`
        args: [ 'mkdir -p /data/db /data/output /data/tmp || echo "warning: could not create the subdirectories of /data" >&2; chown 1000:1000 /data && chmod 2775 /data || echo "warning: could not hand /data to user 1000" >&2' ]
        {{- end }}
        resources: {{- toYaml .Values.celeryWorker.initResources | nindent 10 }}
        volumeMounts:
        - mountPath: /data
          name: prowes-volume
      containers:
      - name: celery-worker
        image: {{ .Values.celeryWorker.image }}
        imagePullPolicy: Always
        workingDir: '/app'
        command: [ 'celery' ]
        args: [ '-A', 'pro_wes.celery_worker', 'worker', '-E', '--loglevel=info', '-c', '1', '-Q', 'celery' ]
        env:
        - name: MONGO_HOST
          value: {{ .Values.mongodb.appName }}
        - name: MONGO_PORT
          value: "27017"
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              key: databaseUser
              name: {{ .Values.mongodb.appName }}
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              key: databasePassword
              name: {{ .Values.mongodb.appName }}
        - name: MONGO_DBNAME
          valueFrom:
            secretKeyRef:
              key: databaseName
              name: {{ .Values.mongodb.appName }}
        - name: RABBIT_HOST
          value: {{ .Values.rabbitmq.appName }}
        - name: RABBIT_PORT
          value: "5672"
        resources: {{- toYaml .Values.celeryWorker.resources | nindent 10 }}
        volumeMounts:
        - mountPath: /data
          name: prowes-volume
      volumes:
      - name: prowes-volume
        persistentVolumeClaim:
          claimName: {{ .Values.prowes.appName }}-volume
