id: foca-config-attribute
language: python
severity: error
message: Untyped access to the FOCA config
note: |
  Use `foca.get_config()`, and for the section `custom`
  `foca.get_custom_config(pro_wes.config_models.CustomConfig)`. Only direct
  attribute access is detected.
# Scoped to app code: tests may access and change the config of test apps
files:
  - pro_wes/**
rule:
  pattern: $APP.config.foca
