services:

  # Celery worker, which tracks the progress of workflow runs
  prowes-worker:
    image: prowes:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    links:
      - mongodb
      - rabbitmq
    command: celery -A pro_wes.celery_worker worker -E --loglevel=info
    volumes:
      - ${PROWES_DATA_DIR:-../data/pro_wes/runs}:/data

  # The app, served by Gunicorn with FOCA's settings
  # (`pro_wes/gunicorn.py`)
  prowes:
    image: prowes:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    links:
      - mongodb
      - rabbitmq
    command: gunicorn --config python:pro_wes.gunicorn pro_wes.wsgi:app
    ports:
      - "8090:8080"
    volumes:
      - ${PROWES_DATA_DIR:-../data/pro_wes/runs}:/data

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    ports:
      - "5682:5672"

  # MongoDB 7.0, the version FOCA is tested with (current PyMongo releases
  # need MongoDB 4.4 or later)
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - ${PROWES_DATA_DIR:-../data/pro_wes}/db:/data/db
    ports:
      - "27027:27017"

  flower:
    image: mher/flower:2.1.0
    restart: unless-stopped
    links:
      - prowes-worker
    command: flower --broker=amqp://guest:guest@rabbitmq:5672// --port=5555
    ports:
      - "5565:5555"
