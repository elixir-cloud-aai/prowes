apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.celeryWorker.appName }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.celeryWorker.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.celeryWorker.appName }}
    spec:
      {{- if ne .Values.clusterType "openshift" }}
      # The image runs as the non-root user 1000; `fsGroup` makes the data
      # volume writable for it (OpenShift assigns user and group itself)
      securityContext:
        fsGroup: 1000
      {{- end }}
      initContainers:
      - name: vol-init
        image: busybox
        command: [ 'mkdir' ]
        args: [ '-p', '/data/db', '/data/output', '/data/tmp' ]
        resources: {{- toYaml .Values.celeryWorker.initResources | nindent 10 }}
        volumeMounts:
        - mountPath: /data
          name: prowes-volume
      containers:
      - name: celery-worker
        image: {{ .Values.celeryWorker.image }}
        imagePullPolicy: Always
        workingDir: '/app'
        command: [ 'celery' ]
        args: [ '-A', 'pro_wes.celery_worker', 'worker', '-E', '--loglevel=info', '-c', '1', '-Q', 'celery' ]
        env:
        - name: MONGO_HOST
          value: {{ .Values.mongodb.appName }}
        - name: MONGO_PORT
          value: "27017"
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              key: databaseUser
              name: {{ .Values.mongodb.appName }}
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              key: databasePassword
              name: {{ .Values.mongodb.appName }}
        - name: MONGO_DBNAME
          valueFrom:
            secretKeyRef:
              key: databaseName
              name: {{ .Values.mongodb.appName }}
        - name: RABBIT_HOST
          value: {{ .Values.rabbitmq.appName }}
        - name: RABBIT_PORT
          value: "5672"
        resources: {{- toYaml .Values.celeryWorker.resources | nindent 10 }}
        volumeMounts:
        - mountPath: /data
          name: prowes-volume
      volumes:
      - name: prowes-volume
        persistentVolumeClaim:
          claimName: {{ .Values.prowes.appName }}-volume
