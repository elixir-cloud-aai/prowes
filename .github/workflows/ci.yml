# Everything that must pass on pull requests and pushes to `dev`: the pull
# request title, lint and build, the docs, test, run the app with Docker
# Compose, scan the Docker image for known vulnerabilities, and, on pushes,
# push the Docker image by digest (with SBOM and provenance attestations),
# scan exactly that digest, then attest, sign (Sigstore) and tag it (as in
# proTES). Forks, which have none of the secrets, run the same checks
# without these side effects and without uploads to code scanning (as for
# pull requests from forks), unless they set the repository variable
# `DOCKERHUB_ORG` to publish to their own organization (fork dry runs).
# `github.repository_owner == 'elixir-cloud-aai'` marks runs of the upstream
# repository. The gate `passed` ("CI passed") is the only required check. No
# `paths:` filters, so that the gate always reports; skip jobs with `if:`
# instead (and allow the skip in the gate). Runs also when a pull request is
# edited, so that the title check follows the title; all jobs run then, as a
# run that skipped the tests would report "CI passed" for the commit
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [dev]

permissions:
  contents: read

# Fully qualified (`docker.io/`), as the attestation needs it. The Docker Hub
# organization is the repository variable `DOCKERHUB_ORG` (by default
# `elixircloud`), so that the scan job, which has no secrets, scans the image
# that is published
env:
  IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/prowes
  # "true" if this run publishes the image: pushes to this repository, or to
  # a fork that sets `DOCKERHUB_ORG` (and the Docker Hub secrets). Jobs' `if:`
  # can't read `env`, so `push` and `publish` repeat the expression
  # (`tests/test_workflows.py`)
  PUBLISH: ${{ github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '') }}

# Only a new head commit of a pull request cancels its runs in progress
# (action `synchronize`, first attempt); runs for other actions and reruns
# wait, so that a run on the same commit never leaves a cancelled, failed
# `CI passed` (see "Cancelled runs" in `actions/gate/README.md` of
# `elixir-cloud-aai/.github`). Runs for pushes get their own group, so that
# none is dropped. Runs for edits that leave the title unchanged share a
# group of their own, so that they don't wait for the run for the pull
# request's commit
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'push' && github.sha ||
      github.event.action == 'edited' && !github.event.changes.title &&
        format('{0}-edited', github.ref) ||
      github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
    && github.event.action == 'synchronize'
    && github.run_attempt == 1 }}

jobs:

  # Pull request titles become the commit messages on `dev` (squash merges):
  # Conventional Commits, at most 50 characters (shared action of
  # elixir-cloud-aai/.github, pinned to the commit of a release). Skipped on
  # pushes and for Dependabot, whose titles can't be configured to pass,
  # unless someone else edits the title
  title:
    name: PR title
    if: >-
      github.event_name == 'pull_request' && (
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        github.event.changes.title &&
        github.event.sender.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check PR title
        uses: elixir-cloud-aai/.github/actions/pr-title@31f22fccc1f3c597ed7c1d1f75b2f85522155348 # v1.1.0

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Python version of the base image in the `Dockerfile`
      # (`requires-python` in `pyproject.toml`)
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # uv, at the version locked in `uv.lock` (a dev dependency)
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      # The lock must match `pyproject.toml` (run `uv lock` after changing
      # dependencies; `uv sync --locked` below checks it too, but this step
      # names the failure)
      - name: Check lock file
        run: uv lock --check
      # The versions of `uv.lock`, into `.venv`, with the Python set up
      # above; mypy checks imports, so runtime dependencies are needed too
      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --python "$(which python)"
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # ruff, mypy, semgrep, ast-grep (rules and their tests), actionlint,
      # the lock check and file checks (`.pre-commit-config.yaml`), and
      # secrets in the whole checkout
      - name: Run linters, type checks and security checks
        run: |
          pre-commit run --all-files --show-diff-on-failure
          pre-commit run --all-files --hook-stage manual gitleaks-all
      # The citation metadata (`CITATION.cff`), against the schema of its
      # `cff-version`. cffconvert 2.0.0 is pinned (as in proTES) and runs in
      # an environment of its own (pipx), so that its dependencies resolve
      # within its own bounds (not bumped by Dependabot; update by hand)
      - name: Validate citation metadata
        run: pipx run --spec cffconvert==2.0.0 cffconvert --validate -i CITATION.cff
      - name: Build distributions
        run: uv build --out-dir dist
      - name: Check wheel contents
        run: |
          unzip -Z1 dist/*.whl | tee wheel-contents.txt
          if grep -Ev '^pro_wes(/|-[^/]+\.dist-info/)' wheel-contents.txt; then
            echo "::error::Unexpected files in wheel"
            exit 1
          fi
          grep -qx 'pro_wes/config.yaml' wheel-contents.txt
          grep -Eqx 'pro_wes-[^/]+\.dist-info/licenses/LICENSE' wheel-contents.txt
          grep -q '^pro_wes/api/.*\.yaml$' wheel-contents.txt

  # The docs (`mkdocs.yml`, `docs/`), as Read the Docs builds them
  # (`.readthedocs.yaml`), with the versions of `uv.lock`
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python version of Read the Docs (`.readthedocs.yaml`)
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # As in `lint`
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      # The versions of `uv.lock`, as in `lint`
      - name: Install dependencies
        run: |
          uv sync --locked --extra docs --python "$(which python)"
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      # Fails on warnings, e.g., of broken links, anchors and references
      - name: Build documentation
        run: mkdocs build --strict

  # The tests use mongomock (`tests/`); a MongoDB entry follows once tests
  # can run against a real database
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # As in `lint`
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --python "$(which python)"
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      # Coverage is reported only, without a threshold, until #81
      - name: Calculate unit test coverage
        run: |
          coverage run -m pytest
          coverage report
          coverage xml
      # Upload errors fail the workflow only on pushes to the upstream
      # repository, because pull requests from forks and Dependabot get no
      # access to the Codecov token, and forks have none
      - name: Submit report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: ${{ github.event_name == 'push' && github.repository_owner == 'elixir-cloud-aai' }}
          verbose: true

  # Runs the app as deployed with Docker Compose (app, Celery worker,
  # MongoDB, RabbitMQ) against a fake WES instead of a real one
  # (`tests/smoke/`): forwards runs, tracks them to their end and cancels
  # one (see the script)
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    # Up to 5 minutes for the services to become healthy (the script's
    # `--wait-timeout`), after the image build
    timeout-minutes: 20
    # The Compose files and project of the script (its defaults), for the
    # steps after it (`docker compose exec`, `docker compose logs`)
    env:
      COMPOSE_FILE: docker-compose.yaml:tests/smoke/compose.yaml
      COMPOSE_PROJECT_NAME: prowes-smoke
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dummy secret files, which must not reach the image (see below)
      - name: Plant dummy secret files
        run: |
          echo "DUMMY=not-a-secret" > pro_wes/.env
          echo "dummy" > pro_wes/tls.key
      # Builds and starts the app, waits until the containers are healthy
      # and checks the API with the fake WES (at the script's default URL)
      - name: Check API with fake WES
        run: tests/smoke/check.sh
      # `prowes:smoke` is the image that `docker-compose.yaml` builds with
      # the override of the smoke test (`tests/smoke/compose.yaml`); the
      # app is installed from a wheel, so the files are looked for anywhere
      # in the image. The app runs as the image's non-root user and can
      # write to the storage of the runs
      - name: Check image contents and user
        run: |
          found="$(docker run --rm --user 0 --entrypoint sh prowes:smoke -c \
            'find / -xdev \( -name .env -o -name tls.key \) -print')"
          if [[ -n "${found}" ]]; then
            echo "::error::Secret files in the image: ${found}"
            exit 1
          fi
          docker compose exec -T prowes sh -c \
            'test "$(id -u)" = 1000 && touch /data/.probe && rm /data/.probe'
      # Also covers failures after the script (which shows the logs of its
      # own failures) and cancellation
      - name: Show app logs
        if: failure() || cancelled()
        run: docker compose logs

  # On pushes that publish (`PUBLISH`), builds the image once and pushes it
  # by digest only (untagged, with SBOM and provenance attestations,
  # `mode=max`), for `scan` to scan and `publish` to sign and tag (as in
  # proTES). Runs alongside the tests, so that the scan starts early; digests
  # of runs that fail (or fail the scan) are never signed or tagged, but stay
  # on Docker Hub, untagged (pullable by digest only)
  push:
    name: Push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same expression as `PUBLISH` (`tests/test_workflows.py`)
    if: ${{ github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '') }}
    # Docker Hub secrets; the environment only allows branch `dev`
    environment: dev-images
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags, to derive the version
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The Docker build gets no Git metadata, so the version (e.g.,
      # `0.20.1.dev4+g<commit>`) is passed as a build argument. It is derived
      # with the build requirements (`build-system.requires`, the dependency
      # group `build-system`), exported from `uv.lock` by the uv image of the
      # `Dockerfile` (pinned by digest, so that the uv binary is verified;
      # without network, as `--frozen` reads the lock only), then installed
      # at the exact versions of the lock, checked against its hashes, as
      # wheels only, into a virtual environment of their own (with the pip
      # of the runner's Python, `ensurepip`)
      - name: Derive version
        id: version
        run: |
          uv_image="$(sed -En 's/^FROM (ghcr\.io\/astral-sh\/uv:[^ @]+@sha256:[0-9a-f]{64}) AS uv$/\1/p' Dockerfile)"
          if [[ -z "${uv_image}" ]]; then
            echo "::error::No uv image pinned by digest in the Dockerfile"
            exit 1
          fi
          requirements="${RUNNER_TEMP}/build-requirements.txt"
          docker run --rm --network none --tmpfs /tmp --env UV_NO_CACHE=1 \
            --volume "${PWD}/pyproject.toml:/src/pyproject.toml:ro" \
            --volume "${PWD}/uv.lock:/src/uv.lock:ro" "${uv_image}" \
            export --frozen --only-group build-system --no-emit-project \
            --project /src > "${requirements}"
          python -m venv "${RUNNER_TEMP}/build-env"
          "${RUNNER_TEMP}/build-env/bin/pip" install --require-hashes \
            --only-binary :all: --no-deps -r "${requirements}"
          version="$("${RUNNER_TEMP}/build-env/bin/python" -m setuptools_scm)"
          echo "Version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # OCI labels with the version, commit and source; the tags are set by
      # `publish`, after the scan
      - name: Generate image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=raw,value=dev
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.version }}

  # Scans the image with Trivy (the shared action
  # `elixir-cloud-aai/.github/actions/scan-image`): for pull requests and
  # pushes to forks (without `DOCKERHUB_ORG`) a local build, for other pushes
  # exactly the digest pushed by `push` (`<image>@<digest>`; public, so
  # pulling it needs no login), in a job without credentials or signing
  # permissions, as the Trivy action resolves the Trivy binary from a mutable
  # tag. The findings that have a fix are uploaded to code scanning of the
  # upstream repository (not in forks, nor for pull requests from forks,
  # whose token cannot write them), and the job fails on critical and high
  # vulnerabilities that have a fix. Accepted findings are listed, with a
  # reason and an expiry date, in `.trivyignore.yaml`
  scan:
    name: Scan image
    # `push` is skipped (by its own `if:` only, as it needs no other job)
    # where `PUBLISH` is "false"; a failed or cancelled push skips the scan
    needs: push
    if: ${{ !cancelled() && contains(fromJSON('["success", "skipped"]'), needs.push.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        if: ${{ env.PUBLISH != 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        if: ${{ env.PUBLISH != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          # Single image, for the local Docker daemon (no attestations)
          provenance: false
          # Named as the pushed image, so that code scanning matches the
          # findings of both
          tags: ${{ env.IMAGE_NAME }}:scan
      - name: Determine image
        id: image
        env:
          DIGEST: ${{ needs.push.outputs.digest }}
        run: |
          if [[ "${PUBLISH}" != "true" ]]; then
            echo "image=${IMAGE_NAME}:scan" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest '${DIGEST}'"
            exit 1
          fi
          echo "image=${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Scan image
        uses: elixir-cloud-aai/.github/actions/scan-image@31f22fccc1f3c597ed7c1d1f75b2f85522155348 # v1.1.0
        with:
          image: ${{ steps.image.outputs.image }}
          category: image
          upload: ${{ github.repository_owner == 'elixir-cloud-aai' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}

  # Attests the build provenance of the scanned digest (GitHub artifact
  # attestation, also pushed to the registry), signs it with Sigstore keyless
  # signing (`cosign`, via the workflow's OIDC token) and only then tags
  # exactly that digest, so that the published image is the scanned one; see
  # "Verifying images" in `docs/operations.md`
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same expression as `PUBLISH` (`tests/test_workflows.py`)
    if: ${{ github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '') }}
    needs: [lint, docs, test, smoke, push, scan]
    # Docker Hub secrets; the environment only allows branch `dev`
    environment: dev-images
    permissions:
      contents: read
      id-token: write # Sigstore signing certificates
      attestations: write # GitHub artifact attestations
    # Publish one image at a time, and only for the newest commit on the
    # branch, so that an older run cannot overwrite `dev` with older code
    concurrency:
      group: ${{ github.workflow }}-publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      DIGEST: ${{ needs.push.outputs.digest }}
    steps:
      - name: Check that commit is still the branch head
        id: head
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          head=$(git ls-remote "https://github.com/${REPOSITORY}.git" "${REF}" | cut -f1)
          [ -n "${head}" ] || { echo "::error::Could not look up ${REF}"; exit 1; }
          if [ "${head}" = "${SHA}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping publish: ${REF} has moved on to ${head}"
          fi
      - name: Check image digest
        if: steps.head.outputs.current == 'true'
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest '${DIGEST}'"
            exit 1
          fi
      - name: Set up Docker Buildx
        if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: steps.head.outputs.current == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Attest build provenance
        if: steps.head.outputs.current == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          # No artifact metadata storage record (needs another permission)
          create-storage-record: false
      - name: Install cosign
        if: steps.head.outputs.current == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # The signature covers the digest, and so every tag of it
      - name: Sign image
        if: steps.head.outputs.current == 'true'
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      # Tags `dev` and `sha-<commit>` (never `latest`, which is for releases,
      # #116) point to the scanned and signed digest: a single source is
      # copied as is
      - name: Tag image
        if: steps.head.outputs.current == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          for tag in "${IMAGE_NAME}:dev" "${IMAGE_NAME}:sha-${SHA}"; do
            docker buildx imagetools create --tag "${tag}" "${IMAGE_NAME}@${DIGEST}"
            actual="$(docker buildx imagetools inspect "${tag}" \
              --format '{{ json .Manifest }}' | jq -r .digest)"
            if [[ "${actual}" != "${DIGEST}" ]]; then
              echo "::error::${tag} points to ${actual}, expected ${DIGEST}"
              exit 1
            fi
          done

  # The only required check: passes if every other job passed, or was skipped
  # where that is intended: `title` (pushes, Dependabot), `push` and
  # `publish` where `PUBLISH` is "false" (pull requests, and forks without
  # `DOCKERHUB_ORG`). Any other result (failure, cancelled, or an unintended
  # skip) fails it. Add every new job to `needs`
  passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [title, lint, docs, test, smoke, push, scan, publish]
    permissions: {}
    steps:
      - name: Check results of all jobs
        uses: elixir-cloud-aai/.github/actions/gate@31f22fccc1f3c597ed7c1d1f75b2f85522155348 # v1.1.0
        with:
          needs: ${{ toJSON(needs) }}
          # `title` is skipped on purpose on pushes and for Dependabot, `push`
          # and `publish` where `PUBLISH` is "false" only
          allow-skipped: ${{ env.PUBLISH == 'false' && 'title push publish' || 'title' }}
